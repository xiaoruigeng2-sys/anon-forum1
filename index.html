<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>【闲聊】这团最近很火，来唠唠 - 匿名吧</title>
<style>
*{box-sizing:border-box;}
body{
  margin:0;background:#0f1115;color:#e4e7ec;
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  font-size:14px;line-height:1.65;-webkit-font-smoothing:antialiased;
}
button{font-family:inherit;cursor:pointer;}

/* ---------- 顶栏 ---------- */
.topbar{
  position:sticky;top:0;z-index:30;height:52px;display:flex;align-items:center;
  gap:10px;padding:0 16px;background:#161920;border-bottom:1px solid #2a2f3a;
}
.logo{display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px;color:#e4e7ec;text-decoration:none;}
.logo-mark{
  width:24px;height:24px;border-radius:7px;display:grid;place-items:center;
  background:linear-gradient(135deg,#3b82f6,#6366f1);color:#fff;font-size:12px;font-weight:700;
}
.topbar-right{margin-left:auto;font-size:12px;color:#7f8898;}

/* ---------- 布局 ---------- */
.wrap{max-width:860px;margin:0 auto;padding:14px 14px 90px;}
.crumb{font-size:12px;color:#7f8898;margin:4px 2px 10px;display:flex;gap:6px;align-items:center;}
.crumb i{font-style:normal;opacity:.55;}

.card{
  background:#1a1d24;border-radius:10px;margin-bottom:14px;overflow:hidden;
  box-shadow:0 1px 3px rgba(0,0,0,.35);
}

/* ---------- 帖子头 ---------- */
.thread-head{padding:18px 20px 16px;border-bottom:1px solid #252a33;}
.thread-title{font-size:19px;font-weight:700;margin:0 0 10px;line-height:1.45;word-break:break-word;color:#eef1f6;}
.thread-meta{display:flex;align-items:center;gap:8px;font-size:12.5px;color:#8b94a3;flex-wrap:wrap;}
.dot{opacity:.5;}

/* ---------- 楼层 ---------- */
.floor{display:flex;gap:12px;padding:16px 20px;}
.floor + .floor{border-top:1px solid #252a33;}
.avatar{
  width:38px;height:38px;border-radius:9px;display:grid;place-items:center;
  flex:0 0 auto;overflow:hidden;user-select:none;
}
.avatar svg{width:22px;height:22px;}
.avatar.sm{width:26px;height:26px;border-radius:7px;}
.avatar.sm svg{width:15px;height:15px;}
.avatar.custom{font-size:19px;color:#fff;background:linear-gradient(135deg,#2a2a3c,#4a4a6a);}
.avatar.sm.custom{font-size:13px;}

.floor-body{flex:1;min-width:0;}
.floor-head{display:flex;align-items:baseline;gap:8px;}
.floor-name{font-size:13px;font-weight:600;color:#c8d0dc;}
.floor-num{margin-left:auto;font-size:12px;color:#6f7888;}
.floor-content{
  font-size:14.5px;line-height:1.75;margin-top:4px;
  word-break:break-word;white-space:pre-wrap;color:#dfe3ea;
}
.floor-foot{display:flex;align-items:center;gap:14px;margin-top:8px;font-size:12.5px;color:#7f8898;}
.act{
  background:none;border:none;padding:0;font-size:12.5px;color:#7f8898;
  display:inline-flex;align-items:center;gap:3px;transition:.15s;
}
.act:hover{color:#6ea8ff;}
.act.liked{color:#e05252;}

/* ---------- 楼中楼 ---------- */
.sub-list{margin-top:10px;background:#20242c;border-radius:8px;padding:4px 10px;}
.sub-item{display:flex;gap:8px;padding:7px 0;}
.sub-item + .sub-item{border-top:1px solid #2a303a;}
.sub-body{flex:1;min-width:0;font-size:13px;line-height:1.65;}
.sub-name{color:#9aa3b2;font-weight:600;}
.sub-text{color:#c8d0dc;word-break:break-word;}
.sub-time{font-size:11px;color:#6f7888;margin-top:1px;}

/* ---------- 回复编辑器 ---------- */
.reply-editor{margin-top:10px;}
.reply-editor textarea{
  width:100%;min-height:64px;border:1px solid #303644;border-radius:8px;
  padding:8px 10px;font-family:inherit;font-size:13px;outline:none;
  resize:vertical;background:#20242c;color:#e4e7ec;
}
.reply-editor textarea::placeholder{color:#6f7888;}
.reply-editor textarea:focus{border-color:#4f8cff;background:#242a34;box-shadow:0 0 0 3px rgba(79,140,255,.12);}
.reply-editor-foot{display:flex;justify-content:flex-end;gap:8px;margin-top:6px;}

/* ---------- 按钮 ---------- */
.btn{
  height:30px;padding:0 14px;border-radius:7px;border:none;
  background:#2f6fdd;color:#fff;font-size:13px;font-weight:500;transition:.15s;
}
.btn:hover{background:#2560c4;}
.btn.ghost{background:#252a33;border:1px solid #353c48;color:#c8d0dc;}
.btn.ghost:hover{background:#2d333d;}

/* ---------- 底部发帖 ---------- */
.composer{padding:16px 20px;}
.composer-title{font-size:13px;font-weight:600;margin-bottom:8px;color:#c8d0dc;}
#mainInput{
  width:100%;min-height:80px;border:1px solid #303644;border-radius:8px;
  padding:10px 12px;font-family:inherit;font-size:13.5px;outline:none;
  resize:vertical;background:#20242c;color:#e4e7ec;
}
#mainInput::placeholder{color:#6f7888;}
#mainInput:focus{background:#242a34;border-color:#4f8cff;box-shadow:0 0 0 3px rgba(79,140,255,.12);}
.composer-foot{display:flex;align-items:center;justify-content:space-between;margin-top:8px;gap:10px;}
.hint{font-size:12px;color:#7f8898;}

/* ---------- Toast ---------- */
.toast{
  position:fixed;left:50%;bottom:30px;transform:translate(-50%,12px);
  background:#2a303a;color:#eef1f6;font-size:13px;padding:8px 16px;border-radius:8px;
  opacity:0;pointer-events:none;transition:.2s;z-index:99;white-space:nowrap;
  box-shadow:0 6px 18px rgba(0,0,0,.45);
}
.toast.show{opacity:1;transform:translate(-50%,0);}

/* ---------- 新楼层高亮 ---------- */
@keyframes flash{from{background:rgba(79,140,255,.18);}to{background:transparent;}}
.floor.flash{animation:flash 1.3s ease;}

/* ---------- 移动端 ---------- */
@media (max-width:600px){
  .wrap{padding:10px 8px 80px;}
  .thread-head{padding:14px;}
  .thread-title{font-size:17px;}
  .floor{padding:13px;gap:9px;}
  .avatar{width:32px;height:32px;border-radius:8px;}
  .avatar svg{width:18px;height:18px;}
  .avatar.sm{width:23px;height:23px;}
  .avatar.sm svg{width:13px;height:13px;}
  .floor-content{font-size:14px;}
  .composer{padding:13px 14px;}
}
</style>
</head>
<body>

<header class="topbar">
  <a class="logo"><span class="logo-mark">匿</span>匿名吧</a>
  <div class="topbar-right">在线 3,271 人</div>
</header>

<main class="wrap">
  <div class="crumb"><span>匿名吧</span><i>›</i><span>正文</span></div>

  <section class="card">
    <div class="thread-head">
      <h1 class="thread-title">【闲聊】这团最近很火，来唠唠</h1>
      <div class="thread-meta">
        <span>匿名用户</span>
        <span class="dot">·</span>
        <span>20:38</span>
        <span class="dot">·</span>
        <span>1.2万 浏览</span>
        <span class="dot">·</span>
        <span id="floorCount">16 楼</span>
      </div>
    </div>
    <div id="floors"></div>
  </section>

  <section class="card composer">
    <div class="composer-title">发表回复</div>
    <textarea id="mainInput" placeholder="说说你的看法……（匿名发布）"></textarea>
    <div class="composer-foot">
      <span class="hint">你将以「匿名用户」的身份发布</span>
      <button class="btn" id="mainSend">发布</button>
    </div>
  </section>
</main>

<div class="toast" id="toast"></div>

<script>
/* =========================================================
   0. 工具
   ========================================================= */
const esc = s => String(s).replace(/[&<>"']/g, c => (
  {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]
));
const pad2 = n => String(n).padStart(2,'0');

/* 只显示时间：时:分 */
function fmt(ts){
  const d = new Date(ts);
  return `${pad2(d.getHours())}:${pad2(d.getMinutes())}`;
}

let cursor = new Date(2024,10,20,20,40,0).getTime();
function nextTs(){
  cursor += 60000 * (1 + Math.floor(Math.random()*3));
  return cursor;
}

let toastTimer;
function toast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>el.classList.remove('show'), 1800);
}

/* =========================================================
   1. 头像：默认统一小人图标 + 随机颜色；偶尔自定义
   ========================================================= */
function avatarHTML(seed, custom, small){
  const cls = 'avatar' + (small ? ' sm' : '');
  if(custom){
    return `<div class="${cls} custom">${custom}</div>`;
  }
  const h = Math.abs(seed * 47) % 360;
  return `<div class="${cls}" style="background:hsl(${h},38%,20%);color:hsl(${h},72%,68%)">
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 11.5a4.25 4.25 0 1 0 0-8.5 4.25 4.25 0 0 0 0 8.5Zm0 2c-4.14 0-7.5 2.24-7.5 5v1.5h15v-1.5c0-2.76-3.36-5-7.5-5Z"/></svg>
  </div>`;
}

/* =========================================================
   2. 帖子数据（主楼 + 楼中楼）
   ========================================================= */
const DATA = [
  { text:"一丑一普怎么敢叫完颜团的", replies:[
    "谁叫完颜团了？大哥哥你立靶子自己打呢？"
  ]},
  { text:"这团到底谁在听", replies:[
    "我",
    "0人问你"
  ]},
  { text:"路人，感觉文道英最好看", replies:[
    "微电影推披皮路人又来了",
    "文道英是门面啊这是常识吧，黑子别急"
  ]},
  { text:"【黑图九宫格】", custom:"😈", replies:[
    "每日一问这九张什么时候能申遗",
    "第一张我真的每看一次笑一次",
    "黑子比粉丝存的图都多我说",
    "因为太丑了忍不住保存哈少往脸上贴金"
  ]},
  { text:"收益率到底凭什么当队长的", replies:[
    "因为年龄大",
    "那建议直接去敬老院竞选院长",
    "队长国民度很高好吗",
    "那为什么我只认识wdy",
    "因为你不是国民"
  ]},
  { text:"别天天营销妈塑了烦不烦", replies:[] },
  { text:"大哥不能别唱了那个高音一出来我家水开了", replies:[
    "建议查查他家里是不是卖烧水壶的",
    "哈喽，你担有一个音能唱到文道英这么高吗",
    "不能，因为人类一般不会发出这种声音"
  ]},
  { text:"这俩人又开始摆那个死人媚粉表情了", replies:[
    "营业痕迹重得要死，找镜头还是找客户",
    "不许这么说我杯杯",
    "你杯杯看镜头的眼神比看自己亲妈还深情",
    "滚吧别到处发情",
    "梦女姐差不多得了他俩又不会跟你上床",
    { text:"那你跟我上？", custom:"😏" },
    "楼上你俩有点暧昧了吧"
  ]},
  { text:"文道英皇族滚", replies:[
    "今天又皇什么了",
    "呼吸",
    "那建议你也呼吸一下看看公司给不给你塞三个代言"
  ]},
  { text:"空降出道，part多，镜头多，资源还最多，粉丝到底怎么好意思天天虐的", replies:[
    "因为他人气高啊，不给他给收益率？"
  ]},
  { text:"每次看微电影资源都感觉收益率是陪嫁丫鬟", replies:[
    "应该是奶娘才对"
  ]},
  { text:"律英今天麦了吗", replies:[
    "麦了麦了，收益率差点就公主抱微电影了",
    "狗猫99",
    "律英批连工业糖精都能磕铁胃牛B"
  ]},
  { text:"英律才是真的，不懂的人有难了", replies:[
    "逆家滚好吗",
    "不觉得律英律更美味吗",
    "无差姐更是赶紧滚"
  ]},
  { text:"团粉呢出来主持一下", replies:[
    "团粉忙着脱cp粉皮呢没空",
    "团粉个锤子，我看是端水嬷",
    "我是端水公"
  ]},
  { text:"我担独美", replies:[
    "你担之前舞台撞了三次队友独美个鸡毛"
  ]},
  { text:"路人问一下这团俩人是不是关系不好", replies:[
    "特别好",
    "特别不好",
    "结婚证比离婚证多一本的含金量",
    "合同比命贵的捆绑度",
    "昨天刚复婚",
    "今天上午又离了",
    "哦可"
  ]}
];

/* =========================================================
   3. 构建楼层对象
   ========================================================= */
const floors = DATA.map((f, i) => {
  const obj = {
    id: 'f' + i,
    custom: f.custom || null,
    content: f.text,
    time: fmt(nextTs()),
    likes: 3 + ((i * 7) % 23),
    liked: false,
    openReply: false,
    replies: []
  };
  obj.replies = (f.replies || []).map((r, j) => {
    const it = (typeof r === 'string') ? { text:r } : r;
    return {
      id: 'f' + i + 'r' + j,
      custom: it.custom || null,
      content: it.text,
      time: fmt(nextTs())
    };
  });
  return obj;
});

/* =========================================================
   4. 渲染
   ========================================================= */
function floorHTML(f, idx){
  const num = idx + 1;
  const av  = avatarHTML(idx * 13 + 5, f.custom, false);

  const subs = f.replies.length ? `
    <div class="sub-list">
      ${f.replies.map((r, j) => {
        const rav = avatarHTML(idx * 13 + 5 + (j + 1) * 11, r.custom, true);
        return `<div class="sub-item">
          ${rav}
          <div class="sub-body">
            <div><span class="sub-name">匿名用户：</span><span class="sub-text">${esc(r.content)}</span></div>
            <div class="sub-time">${r.time}</div>
          </div>
        </div>`;
      }).join('')}
    </div>` : '';

  const editor = f.openReply ? `
    <div class="reply-editor">
      <textarea data-for="${f.id}" placeholder="回复 匿名用户："></textarea>
      <div class="reply-editor-foot">
        <button class="btn ghost" data-act="cancelReply" data-id="${f.id}">取消</button>
        <button class="btn" data-act="sendReply" data-id="${f.id}">发送</button>
      </div>
    </div>` : '';

  return `<div class="floor" data-id="${f.id}">
    ${av}
    <div class="floor-body">
      <div class="floor-head">
        <span class="floor-name">匿名用户</span>
        <span class="floor-num">${num}楼</span>
      </div>
      <div class="floor-content">${esc(f.content)}</div>
      <div class="floor-foot">
        <span>${f.time}</span>
        <button class="act ${f.liked ? 'liked' : ''}" data-act="like" data-id="${f.id}">👍 ${f.likes}</button>
        <button class="act" data-act="reply" data-id="${f.id}">回复</button>
      </div>
      ${subs}
      ${editor}
    </div>
  </div>`;
}

function renderFloors(){
  document.getElementById('floors').innerHTML =
    floors.map((f, i) => floorHTML(f, i)).join('');
  document.getElementById('floorCount').textContent = floors.length + ' 楼';
}

function focusEditor(id){
  requestAnimationFrame(() => {
    const ta = document.querySelector(`textarea[data-for="${id}"]`);
    if(ta){
      ta.focus();
      ta.scrollIntoView({block:'center', behavior:'smooth'});
    }
  });
}

/* =========================================================
   5. 交互
   ========================================================= */
document.addEventListener('click', e => {
  const btn = e.target.closest('[data-act]');
  if(!btn) return;
  const act = btn.dataset.act;
  const id  = btn.dataset.id;
  const f   = floors.find(x => x.id === id);
  if(!f) return;

  /* 点赞 */
  if(act === 'like'){
    f.liked = !f.liked;
    f.likes += f.liked ? 1 : -1;
    renderFloors();
    return;
  }

  /* 展开回复框 */
  if(act === 'reply'){
    floors.forEach(x => x.openReply = false);
    f.openReply = true;
    renderFloors();
    focusEditor(f.id);
    return;
  }

  /* 取消回复 */
  if(act === 'cancelReply'){
    f.openReply = false;
    renderFloors();
    return;
  }

  /* 发送楼中楼 */
  if(act === 'sendReply'){
    const ta = document.querySelector(`textarea[data-for="${f.id}"]`);
    if(!ta) return;
    const text = ta.value.trim();
    if(!text){ toast('回复内容不能为空'); ta.focus(); return; }
    f.replies.push({
      id: 'r' + Date.now(),
      custom: null,
      content: text,
      time: fmt(Date.now())
    });
    f.openReply = false;
    renderFloors();
    toast('回复成功');
    return;
  }
});

/* 发布新楼层 */
document.getElementById('mainSend').addEventListener('click', () => {
  const input = document.getElementById('mainInput');
  const text = input.value.trim();
  if(!text){ toast('内容不能为空'); input.focus(); return; }

  const newId = 'f' + Date.now();
  floors.push({
    id: newId,
    custom: null,
    content: text,
    time: fmt(Date.now()),
    likes: 0,
    liked: false,
    openReply: false,
    replies: []
  });
  input.value = '';
  renderFloors();
  toast('发布成功');

  requestAnimationFrame(() => {
    const el = document.querySelector(`.floor[data-id="${newId}"]`);
    if(el){
      el.scrollIntoView({block:'center', behavior:'smooth'});
      el.classList.add('flash');
    }
  });
});

/* =========================================================
   6. 启动
   ========================================================= */
renderFloors();
</script>
</body>
</html>
